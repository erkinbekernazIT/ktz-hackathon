/* ── Хелперы ──────────────────────────────────────────── */
// Проекция MAP-координат в экранные пиксели
function mapToScreen(mx, mz, my){
  // В Three.js: x=mx*k, y=my (высота), z=mz*k
  // L — группа на поверхности карты, G — глобальная вращение
  const v = new T.Vector3(mx*k, my, mz*k);
  // переводим из локального L в мировой
  L.localToWorld(v);
  v.project(C1);
  return {
    sx: (v.x*.5+.5) * c1.clientWidth,
    sy: (-v.y*.5+.5) * c1.clientHeight
  };
}

// Обновить позиции всех pin-меток (вызывается каждый кадр)
function updatePins(){
  pinList.forEach(p=>{
    const {sx,sy} = mapToScreen(p.wx, p.wz, p.wy);
    p.el.style.transform = `translate(${sx+p.ox}px,${sy+p.oy}px)`;
  });
}

// Создать 3D-шар на карте
function makeBall(mx, mz, col, emissive, r){
  const mesh = new T.Mesh(
    new T.SphereGeometry(r||.4, 10, 8),
    mk(col, {emissive: emissive||col, emissiveIntensity:.8})
  );
  mesh.position.set(mx*k, .55, mz*k);
  L.add(mesh);
  return mesh;
}

// Создать линию между двумя MAP-точками
function makeLine(ax,az, bx,bz, col){
  const geo = new T.BufferGeometry().setFromPoints([
    new T.Vector3(ax*k, .5, az*k),
    new T.Vector3(bx*k, .5, bz*k)
  ]);
  const mat = new T.LineDashedMaterial({color:col,dashSize:.6,gapSize:.4,transparent:true,opacity:.75});
  const ln  = new T.Line(geo, mat);
  ln.computeLineDistances();
  L.add(ln);
  return ln;
}

// Удалить динамические объекты (isDepot=true — только депо)
function clearDyn(onlyDepot){
  dynObj = dynObj.filter(o=>{
    if(onlyDepot && !o.isDepot) return true;
    o.el.remove();
    L.remove(o.mesh);
    if(o.mesh.geometry) o.mesh.geometry.dispose();
    return false;
  });
  if(onlyDepot){
    pinList = pinList.filter(p=>!p.isDepot);
  } else {
    pinList = [];
  }
}

/* Куда сдвинуть карту (G), чтобы точка карты (mx,mz) оказалась в центре экрана */
function centerOn(mx, mz){
  const v = new T.Vector3(mx*k, 0, mz*k);
  L.localToWorld(v);
  return { x: G.position.x - v.x, z: G.position.z - v.z + 4 };
}

/* ── Плавный zoom камеры ──────────────────────────────── */
// Хранит целевые параметры; основной loop interpolates к ним
let camAnim = null;

function smoothZoom(targetD, targetYaw, targetPitch, targetGx, targetGz, ms, cb){
  const t0 = performance.now();
  const s  = { D1, zoom, yaw, pitch, gx: G.position.x, gz: G.position.z };
  const _D = targetD; const _Z = 1;
  camAnim = null; // сбросим старую
  (function step(now){
    const p  = Math.min((now-t0)/ms, 1);
    const e  = p<.5 ? 2*p*p : -1+(4-2*p)*p;
    yaw   = s.yaw   + (targetYaw   - s.yaw)   * e;
    pitch = s.pitch + (targetPitch - s.pitch)  * e;
    D1    = s.D1    + (_D - s.D1)  * e;
    zoom  = 1;
    G.position.x = s.gx + (targetGx - s.gx) * e;
    G.position.z = s.gz + (targetGz - s.gz) * e;
    setCam();
    if(p < 1) requestAnimationFrame(step);
    else { if(cb) cb(); }
  })(t0);
}

/* ── УРОВЕНЬ 1 – зум к городу и показ станций ─────────── */
function drillCity1(cityName, cx, cy){
  clearDyn(false);
  drillLvl  = 1;
  drillCity = { name:cityName, cx, cy };
  drillStn  = null;

  const stations = CITY_DATA[cityName] || [];

  // Рисуем маркеры станций
  stations.forEach((s,i)=>{
    const wx = cx + s.dx * 2.2;
    const wz = cy + s.dz * 2.2;

    const ball = makeBall(wx, wz, 0x1f6fe0, 0x3a9eff);
    const el   = document.createElement('span');
    el.className   = 'pin-lbl';
    el.textContent = s.n;
    lbl.appendChild(el);

    // смещение метки от точки: чередуем выше/ниже
    const oy = (i%2===0) ? -22 : 10;
    pinList.push({ el, wx, wz, wy: .6, ox:-(el.offsetWidth/2||40), oy, isDepot:false });
    dynObj.push({ mesh:ball, el, isDepot:false });

    el.addEventListener('click', ev=>{
      ev.stopPropagation();
      drillStation2(s.n, wx, wz);
    });
  });

  // Зум к городу
  smoothZoom(
    D1 * 0.22,          // приближаем
    yaw,                // yaw не меняем
    0.62,               // смотрим сверху
    centerOn(cx, cy).x, // центрируем по X
    centerOn(cx, cy).z, // центрируем по Z
    900
  );

  showBar(`📍 <span>${cityName}</span> &nbsp;›&nbsp; выберите вокзал`);
  // Скрыть старую панель #stn
  document.getElementById('stn').classList.remove('on');
}

/* ── УРОВЕНЬ 2 – зум к станции и показ депо ──────────── */
function drillStation2(stnName, sx, sz){
  clearDyn(true);   // убираем только депо, станции оставляем

  // Подсветить выбранную станцию
  pinList.forEach(p=>{ p.el.classList.remove('sel'); });
  const selPin = pinList.find(p=>p.el.textContent===stnName);
  if(selPin) selPin.el.classList.add('sel');

  drillLvl = 2;
  drillStn = { name:stnName, wx:sx, wz:sz };

  const deps = DEPOT_DATA[stnName] || ['Депо'];

  deps.forEach((d,i)=>{
    const angle = (i / deps.length) * Math.PI * 2 + Math.PI * 0.2;
    const r     = 4.5;
    const wx    = sx + Math.cos(angle) * r;
    const wz    = sz + Math.sin(angle) * r;

    const ball = makeBall(wx, wz, 0x059669, 0x20d890, .32);
    const line = makeLine(sx, sz, wx, wz, 0x059669);

    const el = document.createElement('span');
    el.className   = 'dep-lbl';
    el.textContent = d;
    lbl.appendChild(el);

    pinList.push({ el, wx, wz, wy:.6, ox:8, oy:-16, isDepot:true });
    dynObj.push({ mesh:ball, el, isDepot:true });
    dynObj.push({ mesh:line, el:document.createElement('span'), isDepot:true });
  });

  // Зум к станции ещё ближе
  smoothZoom(
    D1 * 0.6,
    yaw,
    0.72,
    centerOn(sx, sz).x,
    centerOn(sx, sz).z,
    700
  );

  showBar(`📍 <span>${drillCity?.name||''}</span> &nbsp;›&nbsp; 🚉 <span>${stnName}</span> &nbsp;›&nbsp; депо`);
}
