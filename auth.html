const users={'demo@ktz.kz':{name:'Демо Пользователь',pos:'Диспетчер',pass:'Demo1234'}},msg=$('#msg'),EM=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const say=(t,bad)=>{msg.textContent=t;msg.className='msg'+(bad?' bad':'')};
const fe=(f,m)=>{const w=f.closest('.f');w.classList.toggle('e',!!m);w.querySelector('.er').textContent=m||''};
document.querySelectorAll('input,select').forEach(i=>i.addEventListener('input',()=>fe(i,'')));
function chk(f){let ok=true;const v=n=>f.elements[n],bad=(n,m)=>{fe(v(n),m);ok=false};
const e=v('email').value.trim().toLowerCase();if(!e)bad('email','Введите email');else if(!EM.test(e))bad('email','Некорректный email');
const p=v('pass').value;
if(f.id==='fin'){if(!p)bad('pass','Введите пароль')}
else{const nm=v('name').value.trim().split(/\s+/);if(nm.length<2||nm.some(x=>x.length<2))bad('name','Укажите фамилию и имя полностью');
if(p.length<8||!/[A-Za-zА-Яа-я]/.test(p)||!/\d/.test(p))bad('pass','Минимум 8 символов, буква и цифра');
if(v('pass2').value!==p||!v('pass2').value)bad('pass2','Пароли не совпадают');if(!v('pos').value)bad('pos','Выберите должность');if(!v('ok').checked)bad('ok','Необходимо подтверждение')}
if(!ok){f.classList.remove('bad');void f.offsetWidth;f.classList.add('bad')}return ok}
$('#fin').onsubmit=ev=>{ev.preventDefault();const f=ev.target;say('');if(!chk(f))return;const u=SS.find(f.email.value,f.pass.value);if(u&&u.blocked){say('Аккаунт заблокирован',1);return}if(!u){say('Неверный email или пароль',1);fe(f.pass,'Проверьте введённые данные');return}say('Добро пожаловать, '+u.name+' · '+u.position);const page=SS.start(u);setTimeout(()=>leave(page),650)};
$('#fup').onsubmit=ev=>{ev.preventDefault();const f=ev.target;say('');if(!chk(f))return;const e=f.email.value.trim().toLowerCase();
if(SS.emailTaken(e)){fe(f.email,'Этот email уже зарегистрирован');return}
SS.register({name:f.name.value.trim(),email:e,pass:f.pass.value,role:f.pos.value});say('Регистрация успешна! Теперь войдите.');f.reset();$('#sbi').style.width='0';
setTimeout(()=>{tab('in');$('#fin').email.value=e;$('#fin').pass.focus()},1100)};

function tab(m){const up=m==='up';$('.card').classList.toggle('wide',up);$('#sub').textContent=up?'РЕГИСТРАЦИЯ СОТРУДНИКА КЖД':'ДОСТУП СОТРУДНИКА КЖД';$('#tabs').classList.toggle('reg',up);document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));$('#fin').classList.toggle('on',!up);$('#fup').classList.toggle('on',up);say('')}
